# Publishes a new version automatically.
# On every push to "main", GitHub reads the project's <Version>. If that version is not published yet,
# it builds Uninstallix on Windows, runs the tests, produces Uninstallix-Setup.exe (installer) and
# Uninstallix-Portable.exe (the same exe, runs without installing) and creates the vX.Y.Z release
# that the app detects by itself.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content src/Desinstalleur.App/Desinstalleur.App.csproj
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$(-not $exists)".ToLower() >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "Version $tag is already published: nothing to do." } else { Write-Host "New version to publish: $tag" }
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.publish == 'true'
        with:
          dotnet-version: "8.0.x"

      - name: Engine tests
        if: steps.version.outputs.publish == 'true'
        run: dotnet test tests/Desinstalleur.Core.Tests -c Release

      - name: Build Uninstallix-Setup.exe and Uninstallix-Portable.exe
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          dotnet publish src/Desinstalleur.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none `
            -o setup-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item setup-build/Uninstallix.exe Uninstallix-Setup.exe
          # Same exe: its file name ("Portable") switches it to portable mode.
          Copy-Item setup-build/Uninstallix.exe Uninstallix-Portable.exe

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = "release-notes/$env:TAG.md"
          if (-not (Test-Path $notes)) {
            Set-Content -Path notes.md -Value "New version of Uninstallix." -Encoding utf8
            $notes = "notes.md"
          }
          gh release create $env:TAG Uninstallix-Setup.exe Uninstallix-Portable.exe --target $env:GITHUB_SHA --title "Uninstallix $env:VERSION" --notes-file $notes
